name: BLEFinder
options:
  bundleIdPrefix: com.cinnamobot
  deploymentTarget:
    iOS: "17.0"
targets:
  BLEFinder:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinnamobot.blefinder
        PRODUCT_NAME: BLEFinder
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BLE方向探知
        NSBluetoothAlwaysUsageDescription: 近くのBluetooth機器の電波の強さを測って、発信源の方向と位置を探すために使用します
        NSMotionUsageDescription: 歩いた距離を記録し、あなたの移動軌跡と電波の強さから発信源の位置を推定するために使用します
        NSLocationWhenInUseUsageDescription: コンパスの方位（真北基準）を取得するために使用します。位置そのものは記録・送信しません
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
